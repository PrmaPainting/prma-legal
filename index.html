<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prma · Prma</title>
<style>
:root {
  --surface: #fff8f4; --card: #ffffff; --ink: #2b241f; --muted: #6b5d53;
  --primary: #9f3c16; --line: #eadfd6; --soft: #f6ece5;
}
@media (prefers-color-scheme: dark) {
  :root { --surface: #1c1714; --card: #26201c; --ink: #f2e9e3; --muted: #c4b5aa;
          --primary: #ffb59a; --line: #3a312b; --soft: #2f2722; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--surface); color: var(--ink);
       font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
header.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
header.brand span.mark { font: 600 26px/1 Georgia, "Times New Roman", serif; color: var(--primary); }
header.brand nav { margin-left: auto; display: flex; gap: 14px; font-size: 14px; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; }
h1 { font: 600 32px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 12px; }
h2 { font: 600 22px/1.3 Georgia, "Times New Roman", serif; margin: 32px 0 10px; color: var(--primary); }
h3 { font-size: 17px; margin: 22px 0 6px; }
p, li { color: var(--ink); }
a { color: var(--primary); text-decoration-thickness: 1px; text-underline-offset: 2px; }
code { background: var(--soft); border-radius: 6px; padding: 1px 6px; font-size: 0.92em; }
table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14.5px; display: block; overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--soft); font-weight: 600; }
footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<main>
<header class="brand">
  <span class="mark">Prma</span>
  <nav>
    <a href="prma/terms/">Terms</a>
    <a href="prma/privacy/">Privacy</a>
    <a href="prma/support/">Support</a>
  </nav>
</header>
<article>
<h1>Prma</h1>
<p>Record each stage of a painting, learn from studio tools, and share your process with other painters.</p>
<ul>
  <li><a href="prma/terms/">Terms of Use</a></li>
  <li><a href="prma/privacy/">Privacy Policy</a></li>
  <li><a href="prma/support/">Support</a></li>
</ul>
</article>
<footer>Prma · <a href="mailto:PrmaPainting@gmail.com">PrmaPainting@gmail.com</a></footer>
</main>
</body>
</html>
